    <meta property="og:site_name" content="ChurchManager" />
    <meta property="og:title" content="Gestão organizada para igrejas" />
    <meta property="og:description" content="Organize membros, ministérios, eventos e a gestão da sua igreja em um só lugar." />

    <meta property="og:image" content="https://churchmanager-tcc.onrender.com/og/churchmanager-share.png" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/churchmanager-512.svg" />
    <link rel="apple-touch-icon" href="/icons/churchmanager-192.svg" />
    <script>
      (function () {
        const url = new URL(window.location.href);
        if (url.searchParams.get("utm_source") === "chatgpt.com") {
          url.searchParams.delete("utm_source");
          const query = url.searchParams.toString();
          window.history.replaceState(
            window.history.state,
            "",
            url.pathname + (query ? "?" + query : "") + url.hash
          );
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
